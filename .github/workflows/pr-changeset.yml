name: PR Changeset Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-changeset:
    name: Verify Changeset Presence
    runs-on: ubuntu-latest
    steps:
      - name: Validate Changeset
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);

            // Fetch all changed files for this pull request
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100
            });

            const filenames = files.map(f => f.filename);

            // 1. Check if a valid changeset markdown file exists in .changeset/
            const hasChangeset = files.some(f => 
              f.filename.startsWith('.changeset/') &&
              f.filename.endsWith('.md') &&
              !f.filename.endsWith('README.md') &&
              f.status !== 'removed'
            );

            // 2. Check if the PR modifies package source code requiring a version bump
            const codePackagesPrefixes = ['packages/@nikelyh/', 'apps/dashboard/'];
            const ignoredExtensionsOrPatterns = [
              /\.test\.(ts|tsx|js|jsx)$/,
              /\.spec\.(ts|tsx|js|jsx)$/,
              /__tests__\//,
              /\.md$/,
              /^docs\//,
              /^\.github\//,
              /^\.agents\//,
              /^plans\//,
              /^scratch\//
            ];

            const modifiesPackageCode = filenames.some(filename => {
              const inCodePackage = codePackagesPrefixes.some(prefix => filename.startsWith(prefix));
              if (!inCodePackage) return false;
              const isIgnored = ignoredExtensionsOrPatterns.some(pattern => pattern.test(filename));
              return !isIgnored;
            });

            // 3. Search for an existing bot sticky comment
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100
            });
            const marker = '<!-- metamorph-changeset-bot -->';
            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            // Case A: No package code modified (docs, tests, CI, or internal tools only) -> Bypass
            if (!modifiesPackageCode) {
              if (existingComment) {
                const bypassBody = `${marker}\n> **ℹ️ Changeset not required**\n>\n> Latest commit: \`${commitSha}\`\n> This pull request only modifies documentation, tests, or workflow configuration. No changeset is required.`;
                if (existingComment.body !== bypassBody) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existingComment.id,
                    body: bypassBody
                  });
                }
              }
              core.info('PR modifies only documentation/tests/workflows. Changeset check bypassed.');
              return;
            }

            // Case B: Package code modified and changeset is present -> Success
            if (hasChangeset) {
              const successBody = `${marker}\n> **✅ Changeset detected**\n>\n> Latest commit: \`${commitSha}\`\n> All package modifications in this pull request are covered by a changeset. Thank you!`;
              if (existingComment) {
                if (existingComment.body !== successBody) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existingComment.id,
                    body: successBody
                  });
                }
              }
              core.info('Changeset found in PR. Verification successful.');
              return;
            }

            // Case C: Package code modified but changeset is missing -> Friendly Sticky Reminder
            const reminderBody = `${marker}\n### ⚠️ No Changeset detected\n\nLatest commit: \`${commitSha}\`\n\nThis pull request modifies package source code in \`@nikelyh/*\` or \`apps/dashboard\`, but no changeset file was detected in \`.changeset/\`.\n\nTo ensure automatic semantic versioning and changelog generation upon merging, please add a changeset:\n\n\`\`\`bash\nnpm run changeset\n\`\`\`\n\nFollow the interactive prompts to select the affected package(s) and bump type (**patch** for fixes, **minor** for features). Commit the generated \`.changeset/*.md\` file to this branch to resolve this notice.\n\n*Note: This check is advisory and will not prevent builds or tests from running.*`;

            if (existingComment) {
              if (existingComment.body !== reminderBody) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: reminderBody
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: reminderBody
              });
            }

            core.notice('No changeset detected for package modifications. Posted reminder comment on PR.');
